name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Check formatting
        shell: bash
        working-directory: backend
        run: |
          files="$(gofmt -l .)"
          if [[ -n "${files}" ]]; then
            echo "The following files are not formatted:"
            echo "${files}"
            exit 1
          fi

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Verify module checksums
        working-directory: backend
        run: go mod verify

      - name: Verify generated mocks
        working-directory: backend
        run: |
          go generate ./...
          git diff --exit-code -- tests/unit/mocks

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m
          working-directory: backend

      - name: Build server
        working-directory: backend
        run: go build -trimpath -ldflags="-s -w" -o bin/liapoldus-server ./cmd/server

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: liapoldus-server
          path: backend/bin/liapoldus-server
          if-no-files-found: error

      - name: Build Docker image
        run: docker build --tag liapoldus:ci ./backend

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: liapoldus:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  e2e:
    name: End-to-end tests (REST)
    runs-on: ubuntu-latest
    env:
      LIAPOLDUS_E2E_BASE_URL: http://127.0.0.1:8080
    defaults:
      run:
        working-directory: backend/tests/e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build server
        working-directory: backend
        run: go build -o bin/liapoldus-server ./cmd/server

      - name: Run tests
        run: npm test

  security:
    name: Security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Verify module checksums
        working-directory: backend
        run: go mod verify

      - name: Scan Go dependencies and reachable code
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Scan Go source with gosec
        working-directory: backend
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.10 ./...

      - name: Scan repository for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 detect --source . --no-banner --redact

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
