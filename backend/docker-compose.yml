services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liapoldus
      POSTGRES_USER: liapoldus
      POSTGRES_PASSWORD: liapoldus
    volumes:
      - liapoldus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liapoldus -d liapoldus"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LIAPOLDUS_STORAGE: postgres
      LIAPOLDUS_DATABASE_URL: postgres://liapoldus:liapoldus@postgres:5432/liapoldus?sslmode=disable
      LIAPOLDUS_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  liapoldus-postgres:
