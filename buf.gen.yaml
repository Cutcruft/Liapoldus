version: v2

plugins:
  - local: protoc-gen-go
    out: backend/gen
    opt:
      - paths=source_relative
      - Mesb/esb.proto=github.com/liapoldus/liapoldus/backend/gen/esb;esb
  - local: protoc-gen-go-grpc
    out: backend/gen
    opt:
      - paths=source_relative
      - Mesb/esb.proto=github.com/liapoldus/liapoldus/backend/gen/esb;esb
